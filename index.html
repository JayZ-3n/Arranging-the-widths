<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arranging the Widths</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <form class="audi-form">
        <fieldset>
            <legend>Rent Audi Vehicles</legend>

            <div class="form-group">
                <label for="name">Named</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="car-select">Select</label>
                <select id="car-select" name="car">
                    <option value="audi-80">Audi 80</option>
                    <option value="audi-90">Audi 90</option>
                    <option value="audi-rs6">Audi RS 6</option>
                    <option value="audi-s8">Audi S8</option>
                </select>
            </div>

            <div class="form-group">
                <label>Select</label>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="6" required></textarea>
            </div>
        </fieldset>
    </form>

</body>
</html>
